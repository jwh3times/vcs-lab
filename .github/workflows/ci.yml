# The release gate of docs/testing.md, run on every push and pull request on
# both platforms the project supports. Until this existed the gate ran by hand
# on one host, and v0.13.0 shipped with two tests red in every session-off
# mode on POSIX because the host that ran the gate defaults the session on.
#
# What is deliberately not here: `npm run test:benchmark`. Its baseline is
# per-host and the latency rule compares against the maintainer's machines, so
# a runner would report noise as regression. Demos and the packed-install
# smoke test remain release-time steps in docs/testing.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          for file in bin/*.js src/*.js scripts/*.mjs test/*.js; do
            node --check "$file"
          done
      - name: Documentation links
        run: npm run test:docs
      - name: Agent skill mirrors
        run: npm run sync:agents -- --check
      - name: Whitespace
        # Against the empty tree, so the whole checkout is checked rather than
        # one commit's delta; the checkout is shallow, so HEAD~1 may not exist.
        run: git diff --check "$(git mktree </dev/null)" HEAD

  suite:
    # One job per suite mode per platform. Each mode changes what a read
    # or a forecast passes through, so the modes are qualified separately
    # rather than folded into one run (docs/testing.md, Development validation).
    name: ${{ matrix.mode }} / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
        mode:
          - default
          - session-on
          - session-off
          - forecast-worktree
          - forecast-merge-tree
          - engine-native
        include:
          # The Node floor (package.json engines) is qualified in the two
          # session modes on one platform; the rest of the matrix is about
          # Git transports and engines, which Node's version does not change.
          - { os: ubuntu-latest, node: 20, mode: default }
          - { os: ubuntu-latest, node: 20, mode: session-on }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Toolchain
        run: |
          git --version
          node --version
      - name: Select the mode
        run: |
          case "${{ matrix.mode }}" in
            default) ;;
            session-on) echo "VLAB_GIT_SESSION=1" >> "$GITHUB_ENV" ;;
            session-off) echo "VLAB_GIT_SESSION=0" >> "$GITHUB_ENV" ;;
            forecast-worktree) echo "VLAB_FORECAST_ENGINE=worktree" >> "$GITHUB_ENV" ;;
            forecast-merge-tree) echo "VLAB_FORECAST_ENGINE=merge-tree" >> "$GITHUB_ENV" ;;
            engine-native) echo "VLAB_ENGINE=native" >> "$GITHUB_ENV" ;;
            *) echo "unknown mode ${{ matrix.mode }}" >&2; exit 1 ;;
          esac
      - name: Suite
        run: npm test 2>&1 | tee suite.log
      - name: Nothing self-skipped unexpectedly
        # A test that skips itself when the host cannot run it (a Git older
        # than the merge-tree engine needs, no SHA-256 support) reports green
        # while proving nothing. Exactly one skip is expected on a current
        # toolchain: the too-old-Git case, which is covered with a spoofed
        # version instead. Any other count means the runner's toolchain is not
        # exercising what this job exists to exercise.
        run: |
          skipped="$(grep -E '^(ℹ|#) skipped' suite.log | tail -1 | awk '{print $NF}')"
          echo "skipped: ${skipped:-none reported}"
          test "$skipped" = "1"
      - name: No lingering vlab processes
        # Release-gate item 7. The suite's fixtures start Git object-session
        # workers and Git processes; every one must be gone when the suite is.
        # Linux only: the Windows runner's Git Bash has no pgrep.
        if: runner.os == 'Linux'
        run: |
          if pgrep -f "git-session-worker|merge-tree-session-worker|cat-file --batch" >/dev/null 2>&1; then
            pgrep -af "git-session-worker|merge-tree-session-worker|cat-file --batch"
            echo "processes survived the suite" >&2
            exit 1
          fi
